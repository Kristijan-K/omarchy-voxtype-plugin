# Voxtype preset manager popup — float like the voice assistant / OSD windows.
windowrule = float on, match:class ^(io\.github\.kkosu\.voxtype-presets\.gui)$
windowrule = center on, match:class ^(io\.github\.kkosu\.voxtype-presets\.gui)$
windowrule = size 520 560, match:class ^(io\.github\.kkosu\.voxtype-presets\.gui)$
windowrule = rounding 12, match:class ^(io\.github\.kkosu\.voxtype-presets\.gui)$
windowrule = animation popin, match:class ^(io\.github\.kkosu\.voxtype-presets\.gui)$
